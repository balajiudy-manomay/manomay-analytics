name: Deploy dev branch to Vercel

# Triggers ONLY on pushes to `dev`, plus optional manual runs. No other branch
# push (including main) triggers this workflow.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

# Prevent two deploys of the same branch racing each other.
concurrency:
  group: deploy-dev-vercel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Vercel (dev)
    runs-on: ubuntu-latest
    # These three secrets must exist in this repo's GitHub Actions secrets
    # (Settings > Secrets and variables > Actions). Vercel CLI reads
    # VERCEL_ORG_ID / VERCEL_PROJECT_ID from the environment automatically —
    # no .vercel/project.json is committed, so nothing here ever points at
    # the existing Vercel project.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Diagnostic only — never prints secret VALUES (GitHub redacts those
      # automatically), only lengths/whether-empty, to catch a blank secret
      # or a stray copy-pasted newline/space without exposing anything.
      # Remove this step once the real cause is found.
      - name: Debug Vercel secrets (lengths only, no values)
        run: |
          echo "VERCEL_TOKEN is set: $([ -n "$VERCEL_TOKEN" ] && echo yes || echo NO)"
          echo "VERCEL_TOKEN length: ${#VERCEL_TOKEN}"
          echo "VERCEL_ORG_ID is set: $([ -n "$VERCEL_ORG_ID" ] && echo yes || echo NO)"
          echo "VERCEL_ORG_ID length: ${#VERCEL_ORG_ID}"
          echo "VERCEL_PROJECT_ID is set: $([ -n "$VERCEL_PROJECT_ID" ] && echo yes || echo NO)"
          echo "VERCEL_PROJECT_ID length: ${#VERCEL_PROJECT_ID}"

      # Pulls this project's settings AND its Environment Variables from
      # Vercel (configured in the Vercel dashboard, not in this repo) so the
      # build below has the real runtime config without anything being
      # hardcoded or committed here
      - name: Pull Vercel project settings & environment variables
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Vercel's own build pipeline, not a bare `next build` — this app has
      # API routes, middleware, and cookie-based auth, so it needs Vercel's
      # serverless build output, not a static export.
      - name: Build project artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
